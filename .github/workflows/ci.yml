name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  build:
    needs: test
    # Branch protection requires exactly one check named `build`. A *skipped*
    # required check counts as satisfied, so `needs: test` alone would make a PR
    # with a red test matrix mergeable. Always run, then fail loudly instead.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if the test matrix did not pass
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run GitVersion
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /showvariable SemVer)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.gitversion.outputs.version }}

      - name: Pack
        run: |
          dotnet pack src/MemoryLens.Mcp/MemoryLens.Mcp.csproj --no-build -c Release -p:PackageVersion=${{ steps.gitversion.outputs.version }} -o ./artifacts

      - name: Push to NuGet (pre-release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  alert:
    needs: [test, build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the red-main issue
        if: needs.test.result != 'success' || needs.build.result != 'success'
        run: |
          set -euo pipefail
          existing=$(gh issue list --label ci-red --state open --json number --jq '.[0].number // empty')
          body=$(printf 'CI failed on `main` at %s.\n\nRun: %s\n' "$SHA" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Commented on existing issue #$existing"
          else
            gh issue create --title "CI is red on main" --label ci-red --body "$body"
            echo "Opened a new ci-red issue"
          fi

      - name: Close the red-main issue on recovery
        if: needs.test.result == 'success' && needs.build.result == 'success'
        run: |
          set -euo pipefail
          existing=$(gh issue list --label ci-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$(printf 'Recovered on %s.\n\nRun: %s\n' "$SHA" "$RUN_URL")"
            gh issue close "$existing"
            echo "Closed issue #$existing"
          else
            echo "No open ci-red issue; nothing to close"
          fi
