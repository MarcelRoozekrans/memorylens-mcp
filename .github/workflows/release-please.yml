name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        # No `release-type` input: passing it puts the action in single-package mode,
        # where release-please-config.json is ignored entirely and its `extra-files`
        # never run. That is why server.json sat at 1.3.4 while the manifest reached
        # 1.5.1. The config file already declares "release-type": "simple", so dropping
        # the input changes nothing else.
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - uses: actions/setup-node@v7
        with:
          # npm >= 11.5.1 is required for trusted publishing (OIDC); Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/MemoryLens.Mcp/MemoryLens.Mcp.csproj -c Release --no-build -p:PackageVersion=${{ needs.release-please.outputs.version }} -o ./nupkg

      # This is now the ONLY place the project publishes to NuGet.
      #
      # `--skip-duplicate` is safe here and was not safe in ci.yml. Here the version
      # comes from a release-please tag, so it is unique per release and a duplicate
      # can only mean this workflow is being re-run after a later step failed -- the
      # flag makes that idempotent. In ci.yml the version repeated across every main
      # commit between releases, so the same flag silently discarded real packages.
      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The npm package is a launcher that installs the NuGet tool at a matching
      # version, so it must be published after the NuGet push, never before.
      # Trusted publishing (OIDC) — no NODE_AUTH_TOKEN; uses the workflow-level
      # `id-token: write` permission.
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        # The registry validates the version against NuGet's search index, which for a
        # NEW version can lag 5-15+ min behind the upload the `publish` job just did
        # (new versions index far slower than updates to an existing package). A single
        # attempt therefore fails the release on indexing lag and leaves the registry
        # entry stale until someone re-runs the workflow by hand. Retry with backoff
        # over a ~25 min window so we ride it out.
        #
        # Authentication happens INSIDE the loop, and that is load-bearing. The registry
        # JWT expires a few minutes after it is minted, which is well inside this
        # window, so a token taken once up front would make every attempt past roughly
        # the fifth a guaranteed 401 "token is expired" while the loop reported the
        # failure as NuGet indexing lag.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          max_attempts=15
          delay=30
          for attempt in $(seq 1 "$max_attempts"); do
            if ! ./mcp-publisher login github-oidc; then
              echo "::warning::OIDC login failed on attempt $attempt/$max_attempts."
            else
              if ./mcp-publisher publish >publish.log 2>&1; then
                cat publish.log
                echo "Published $VERSION to MCP Registry on attempt $attempt."
                exit 0
              fi
              cat publish.log
              # A 422 means the registry read the payload and rejected its CONTENTS
              # (e.g. a description over the schema's 100-char cap). Time cannot fix
              # that, so stop here. Without this check the loop reported a hard
              # validation error as indexing lag and burned 25 min doing it.
              if grep -q 'status 422' publish.log; then
                echo "::error::MCP Registry rejected server.json as invalid (HTTP 422) -- see the validation errors above. This is a payload problem, not NuGet indexing lag; retrying cannot help."
                exit 1
              fi
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::notice::MCP Registry publish attempt $attempt/$max_attempts failed (NuGet is likely still indexing $VERSION); retrying in ${delay}s"
              sleep "$delay"
              # Ramp up to a 2 min cap so the total window is ~25 min without hammering.
              [ "$delay" -lt 120 ] && delay=$((delay + 30))
            fi
          done
          echo "::error::MCP Registry publish failed after $max_attempts attempts (~25 min). NuGet may still be indexing $VERSION; once nuget.org shows it, re-run the 'Publish to MCP Registry' workflow (Actions -> Publish to MCP Registry -> Run workflow)."
          exit 1
