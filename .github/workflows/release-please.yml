name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        # No `release-type` input: passing it puts the action in single-package mode,
        # where release-please-config.json is ignored entirely and its `extra-files`
        # never run. That is why server.json sat at 1.3.4 while the manifest reached
        # 1.5.1. The config file already declares "release-type": "simple", so dropping
        # the input changes nothing else.
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          # npm >= 11.5.1 is required for trusted publishing (OIDC); Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/MemoryLens.Mcp/MemoryLens.Mcp.csproj -c Release --no-build -p:PackageVersion=${{ needs.release-please.outputs.version }} -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The npm package is a launcher that installs the NuGet tool at a matching
      # version, so it must be published after the NuGet push, never before.
      # Trusted publishing (OIDC) — no NODE_AUTH_TOKEN; uses the workflow-level
      # `id-token: write` permission.
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
